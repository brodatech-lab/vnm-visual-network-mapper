name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config \
            libsqlite3-dev libglfw3-dev libgl1-mesa-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVNM_BUILD_GUI=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp build/vnm dist/
          cp build/src/ui/vnm_gui dist/
          cp assets/vnm.png dist/
          cp packaging/vnm.desktop dist/
          tar -C dist -czf vnm-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vnm-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVNM_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/vnm.exe dist/
          Copy-Item build/src/ui/vnm_gui.exe dist/
          Compress-Archive -Path dist/* -DestinationPath vnm-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vnm-windows-x86_64.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag

          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.MULTILINE | re.DOTALL)
          body = match.group(1).strip() if match else "See CHANGELOG.md."

          # Map changelog sections onto the release wording.
          body = re.sub(r"^### Added.*$", "## What's new", body, flags=re.MULTILINE)
          body = re.sub(r"^### (Changed|Fixed|Removed|Deprecated).*$",
                        "## What's changed", body, flags=re.MULTILINE)

          # Collapse consecutive duplicate headers.
          lines = []
          last_header = None
          for line in body.splitlines():
              if line.startswith("## "):
                  if line == last_header:
                      continue
                  last_header = line
              lines.append(line)
          body = "\n".join(lines).strip()

          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(f"# VNM {tag}\n\n{body}\n")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/vnm-linux-x86_64.tar.gz
            artifacts/windows/vnm-windows-x86_64.zip
          body_path: release_notes.md
